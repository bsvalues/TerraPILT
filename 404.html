<!DOCTYPE html>
<html lang="en">
<head>

    <title>Page Not Found - Benton County PILT Dashboard</title>

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;

            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {

        }

            background-color: #f8f9fa;

            padding: 20px;
            margin: 30px 0;
            border-left: 5px solid #0077b6;
        }
        a {
            color: #0077b6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

<body>
    <div class="container">
        <h1>404 - Page Not Found</h1>

        </div>
        <p><a href="/">Return to Dashboard</a></p>
